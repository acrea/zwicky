/* ---- themes/dm.css */
/* Theme "DM" — Dennis's personal theme, derived from his slide deck (§5.3).
 * Editorial black and white, generous whitespace, serif type, few confident accents.
 * The only theme: change the look by editing these tokens; components use tokens only. */

:root {
  /* surfaces */
  --bg: #ffffff;
  --bg-chrome: #fafaf8;
  --bg-subtle: #f1f1ee;
  --bg-band: #eeeeee;
  --surface: #ffffff;

  /* ink */
  --ink: #111111;
  --ink-muted: #555555;
  --ink-faint: #8a8a8a;
  --ink-on-accent: #ffffff;

  /* lines */
  --rule: #e2e2e2;
  --rule-strong: #111111;
  --rule-dim: #cfcfcf;

  /* accents */
  --accent: #1a8c9e;
  --accent-tint: color-mix(in srgb, #1a8c9e 12%, transparent);
  --focus-ring: 0 0 0 3px color-mix(in srgb, #1a8c9e 38%, transparent);
  --link: #167a8a; /* teal darkened to reach 4.5:1 as text */
  --tab-indicator: #1a8c9e;
  --danger: #b03a3a;
  --danger-bg: #f4c7c7;
  --warning: #e08a00;
  --note-marker: #555555;

  /* stages (problem scope 1–3: strongest tint first) and marks */
  --stage-1-bg: color-mix(in srgb, #1a8c9e 26%, transparent);
  --stage-2-bg: color-mix(in srgb, #1a8c9e 13%, transparent);
  --stage-3-bg: color-mix(in srgb, #1a8c9e 5%, transparent);
  --beyond-scope-opacity: 0.35;
  --mark-out-ink: #8a8a8a;
  --heat-ink: #1a8c9e; /* heatmap: single hue, tinted by score */

  /* options: distinct on white, roughly colour-blind-aware. --on-option-N is the
   * text colour on that option (numbers in markers), chosen for >= 4.5:1. */
  --option-1: #1a8c9e; /* teal */
  --option-2: #d4006f; /* magenta */
  --option-3: #e08a00; /* orange */
  --option-4: #2f5fd0; /* blue */
  --option-5: #3a9a5b; /* green */
  --option-6: #8a4fc7; /* purple */
  --option-7: #c9472b; /* vermillion */
  --option-8: #6b7785; /* slate */
  --on-option-1: #111111;
  --on-option-2: #ffffff;
  --on-option-3: #111111;
  --on-option-4: #ffffff;
  --on-option-5: #111111;
  --on-option-6: #ffffff;
  --on-option-7: #ffffff;
  --on-option-8: #ffffff;
  --option-tint-strength: 14%;

  /* type. UI controls use a neutral system sans: Lora felt too fussy at button
   * size, while content (cells, notes, dimension titles) stays in Lora. */
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Lora', Georgia, 'Times New Roman', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-lg: 19px;
  --fs-xl: 24px;
  --fs-note: 12.5px;
  --fs-band: 17px;
  --fs-wordmark: 28px;
  --lh-tight: 1.35;
  --lh-body: 1.45;
  --wordmark-weight: 800;
  --wordmark-tracking: -0.01em;
  --wordmark-dot: #111111;
  --title-weight: 700;
  --title-tracking: 0;

  /* shape */
  --radius: 4px;
  --band-radius: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 40px;
}

/* zwicky. layout and components. Uses theme tokens only (themes/*.css). */

/* ---------------------------------------------------------------- density */

:root {
  /* Normal density: ~150 px cells (§3.1). At 1440 px, 8 parameters per row fit
   * with the inspector closed (I); with it open the grid scrolls sideways. */
  --cell-w: 150px;
  --dim-w: 168px;
  --ghost-w: 34px;
  --cell-pad-x: 11px;
  --cell-pad-top: 19px;
  --cell-pad-bottom: 11px;
  --cell-min-h: 64px;
  --fs-cell: 14px;
  --inspector-w: 300px;
}
:root[data-density='compact'] {
  /* fits 8 parameters per row at 1440 px with the inspector open */
  --cell-w: 116px;
  --dim-w: 140px;
  --cell-pad-x: 8px;
  --cell-pad-top: 17px;
  --cell-pad-bottom: 8px;
  --cell-min-h: 54px;
  --fs-cell: 13px;
}
:root[data-density='roomy'] {
  --cell-w: 184px;
  --dim-w: 196px;
  --cell-pad-x: 13px;
  --cell-pad-top: 20px;
  --cell-pad-bottom: 13px;
  --cell-min-h: 72px;
  --fs-cell: 15px;
}
:root[data-coords='off'] {
  --cell-pad-top: 10px;
}

/* ---------------------------------------------------------------- base */

*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
kbd {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
  color: var(--ink-muted);
  background: var(--surface);
}
.offscreen {
  position: fixed;
  left: -9999px;
  top: 0;
}
.muted {
  color: var(--ink-muted);
}

/* ---------------------------------------------------------------- app layout */

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--inspector-w);
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}
.app.inspector-closed {
  grid-template-columns: minmax(0, 1fr) 0;
}
.app.file-over::after {
  content: 'Drop a .zwicky.md file to open it';
  position: fixed;
  inset: 12px;
  display: grid;
  place-items: center;
  border: 2px dashed var(--accent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  font: var(--fs-lg) var(--font-ui);
  z-index: 50;
  pointer-events: none;
}

/* ---------------------------------------------------------------- top bar */

.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  background: var(--bg-chrome);
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  min-width: 0;
}
.wordmark {
  font-family: var(--font-display);
  font-weight: var(--wordmark-weight);
  font-size: var(--fs-wordmark);
  letter-spacing: var(--wordmark-tracking);
  line-height: 1;
  white-space: nowrap;
  user-select: none;
}
.wordmark .dot {
  color: var(--wordmark-dot);
}
.doc-title {
  font-family: var(--font-display);
  font-weight: var(--title-weight);
  font-size: var(--fs-lg);
  letter-spacing: var(--title-tracking);
  border: 0;
  border-bottom: 1px solid var(--rule-strong);
  background: transparent;
  padding: 2px 2px 1px;
  width: 22ch;
  min-width: 8ch;
  flex: 0 1 auto;
}
.doc-title:focus-visible {
  outline: none;
  border-bottom-color: var(--accent);
  box-shadow: 0 2px 0 0 var(--accent);
}
.tabs {
  display: flex;
  gap: var(--space-1);
  margin-left: var(--space-3);
}
.tab {
  border: 0;
  background: none;
  padding: var(--space-2) var(--space-3);
  color: var(--ink-muted);
  border-bottom: 2px solid transparent;
  font-size: var(--fs-md);
}
.tab:hover {
  color: var(--ink);
}
.tab[aria-selected='true'] {
  color: var(--ink);
  border-bottom-color: var(--tab-indicator);
  font-weight: 600;
}
.spacer {
  flex: 1;
}
.status {
  color: var(--ink-muted);
  font-size: var(--fs-xs);
  white-space: nowrap;
}
.status.dirty::before {
  content: '●';
  color: var(--accent);
  margin-right: 5px;
}
.icon-btn,
.menu-btn,
.btn,
.toggle {
  border: 1px solid transparent;
  background: none;
  border-radius: var(--radius);
  padding: 4px 8px;
  line-height: 1.3;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  white-space: nowrap;
}
.icon-btn {
  min-width: 30px;
  font-size: var(--fs-md);
}
.icon-btn:hover,
.menu-btn:hover,
.menu-btn[aria-expanded='true'],
.btn:hover {
  background: var(--bg-subtle);
}
.icon-btn:disabled {
  opacity: 0.35;
  cursor: default;
  background: none;
}
.icon-btn[aria-pressed='true'] {
  background: var(--bg-subtle);
}
.btn-group {
  display: flex;
}
.caret {
  margin-left: 4px;
  font-size: 0.8em;
  color: var(--ink-muted);
}

/* menus */
.menu {
  position: fixed;
  z-index: 40;
  min-width: 210px;
  padding: var(--space-1);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: 0 8px 28px rgb(0 0 0 / 0.12);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
}
.menu-item {
  display: flex;
  align-items: center;
  width: 100%;
  gap: var(--space-2);
  border: 0;
  background: none;
  padding: 5px 8px;
  border-radius: calc(var(--radius) - 1px);
  text-align: left;
}
.menu-item:hover,
.menu-item:focus-visible {
  background: var(--bg-subtle);
  outline: none;
}
.menu-item .check {
  width: 12px;
  color: var(--accent);
}
.menu-label {
  flex: 1;
}
.menu-shortcut {
  color: var(--ink-faint);
  font-size: var(--fs-xs);
}
.menu-sep {
  height: 1px;
  background: var(--rule);
  margin: var(--space-1) 0;
}
.menu-heading {
  padding: 6px 8px 2px 28px;
  color: var(--ink-muted);
  font-size: var(--fs-xs);
}

/* ---------------------------------------------------------------- main */

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}
.tab-head {
  padding: var(--space-4) var(--space-5) var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.tab-head:empty {
  display: none;
}
.tab-body {
  flex: 1;
  min-height: 0;
  display: flex;
}

/* key-message band (problem statement) */
.note-band {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}
.note-band.band {
  background: var(--bg-band);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--band-radius);
}
.band-arrow {
  font-family: var(--font-ui);
  font-size: var(--fs-xl);
  line-height: 1.1;
  color: var(--ink);
}
.band-field {
  flex: 1;
  margin: 0;
}
.band-field .field-label {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
.note-band .band-input {
  width: 100%;
  border: 0;
  background: transparent;
  resize: none;
  padding: 2px 0;
  font-family: var(--font-body);
  font-size: var(--fs-band);
  line-height: var(--lh-tight);
  overflow: hidden;
  min-height: 0;
}
.note-band .band-input:focus-visible {
  outline: none;
  box-shadow: none;
}
.note-band.band:focus-within {
  box-shadow: var(--focus-ring);
}
.note-band.intro .band-input {
  font-size: var(--fs-md);
  color: var(--ink-muted);
  font-style: italic;
}
.note-band.intro:focus-within .band-input {
  color: var(--ink);
  font-style: normal;
}
.band-input::placeholder {
  color: var(--ink-faint);
}

/* ---------------------------------------------------------------- grid */

.grid-scroll {
  flex: 1;
  overflow: auto;
  position: relative;
  min-width: 0;
}
.grid-canvas {
  position: relative;
  width: max-content;
  min-width: 100%;
  padding: 0 var(--space-5) var(--space-6) 0;
}
svg.paths {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 0;
  pointer-events: none;
  overflow: visible;
}
.path polyline {
  fill: none;
  stroke: var(--opt);
  stroke-width: 3;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.path circle {
  fill: var(--opt);
}
.path.other {
  opacity: 0.42;
}
.path.other polyline {
  stroke-width: 2;
}
.grid {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--rule);
}
.row {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--rule);
}
.cell {
  position: relative;
  z-index: 1;
  flex: 0 0 var(--cell-w);
  width: var(--cell-w);
  min-height: var(--cell-min-h);
  padding: var(--cell-pad-top) var(--cell-pad-x) var(--cell-pad-bottom);
  border-left: 1px solid var(--rule);
  font-family: var(--font-body);
  font-size: var(--fs-cell);
  line-height: var(--lh-tight);
  overflow-wrap: anywhere;
  hyphens: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: default;
  user-select: none;
}
.cell.dim {
  position: sticky;
  left: 0;
  z-index: 3;
  flex-basis: var(--dim-w);
  width: var(--dim-w);
  background: var(--bg);
  border-left: 0;
  border-right: 1px solid var(--rule-dim);
  padding-left: var(--space-5);
  font-weight: 600;
  cursor: grab;
}
.cell.param {
  cursor: grab;
}
.cell .title {
  white-space: pre-wrap;
}
/* keep titles legible where an option path runs underneath */
.grid-canvas[data-section='solution'] .cell.param .title {
  text-shadow:
    0 0 2px var(--bg),
    0 0 2px var(--bg),
    0 0 3px var(--bg);
}
.cell .title.empty {
  color: var(--ink-faint);
  font-style: italic;
  font-weight: 400;
}
.cell .coord {
  position: absolute;
  top: 3px;
  left: 5px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1;
  font-weight: 400;
  color: var(--ink-faint);
  letter-spacing: 0.02em;
}
.cell.dim .coord {
  left: var(--space-5);
}
:root[data-coords='off'] .cell .coord {
  display: none;
}
.cell .fold {
  position: absolute;
  top: 0;
  right: 0;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 0 10px 10px 0;
  border-color: transparent var(--note-marker) transparent transparent;
}
.cell .markers {
  margin-top: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.marker {
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--opt);
  color: var(--on-opt);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  line-height: 16px;
  text-align: center;
}
.marker.alt {
  outline: 1.5px dashed var(--opt);
  outline-offset: 1px;
}
.cell.ghost {
  flex-basis: var(--ghost-w);
  width: var(--ghost-w);
  padding-left: 0;
  padding-right: 0;
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  cursor: pointer;
  border-left: 1px dashed var(--rule);
}
.cell.ghost .title {
  font-family: var(--font-ui);
}
.cell.ghost:hover,
.cell.ghost.selected {
  color: var(--ink);
  background: var(--bg-subtle);
}
.cell.ghost:has(.inline-edit) {
  flex-basis: var(--cell-w);
  width: var(--cell-w);
  padding: var(--cell-pad-top) var(--cell-pad-x) var(--cell-pad-bottom);
  align-items: stretch;
  justify-content: flex-start;
}
.ghost-row {
  border-bottom: 0;
}
.cell.dim.ghost {
  flex-basis: var(--dim-w);
  width: var(--dim-w);
  padding-left: var(--space-5);
  align-items: flex-start;
  font-weight: 400;
  border-left: 0;
  border-right: 0;
  min-height: 40px;
  padding-top: 10px;
}

/* states: selected, stages, out, picked, beyond the scope filter */
.cell.stage-1 {
  background: var(--stage-1-bg);
}
.cell.stage-1 .title {
  font-weight: 600;
}
.cell.stage-2 {
  background: var(--stage-2-bg);
}
.cell.stage-3 {
  background: var(--stage-3-bg);
}
.cell.beyond-scope > :not(.coord),
.chip.beyond-scope,
.opt-head.beyond-scope > * {
  opacity: var(--beyond-scope-opacity);
}
.cell.mark-out .title {
  color: var(--mark-out-ink);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.cell.picked {
  background: color-mix(in srgb, var(--opt) var(--option-tint-strength), transparent);
  box-shadow: inset 3px 0 0 var(--opt);
}
.cell.dim.picked {
  background: var(--bg);
}
.cell.selected {
  z-index: 2;
  outline: 2px solid var(--ink);
  outline-offset: -2px;
}
.cell.dim.selected {
  z-index: 4;
}
.cell.selected:focus-visible,
.cell.selected:focus {
  outline: 2px solid var(--ink);
  outline-offset: -2px;
  box-shadow: var(--focus-ring);
}
.cell.picked.selected:focus {
  box-shadow: inset 3px 0 0 var(--opt), var(--focus-ring);
}
.grid.pick-mode .cell.param {
  cursor: copy;
}
.cell.dragging {
  opacity: 0.4;
}
.cell.drop-before {
  box-shadow: inset 3px 0 0 var(--accent);
}
.cell.drop-after {
  box-shadow: inset -3px 0 0 var(--accent);
}
.row.drop-before,
.ghost-row.drop-before {
  box-shadow: inset 0 3px 0 var(--accent);
}
.row.drop-after {
  box-shadow: inset 0 -3px 0 var(--accent);
}
.inline-edit {
  width: 100%;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  resize: none;
  overflow: hidden;
  font: inherit;
  line-height: inherit;
  outline: none;
}

/* ---------------------------------------------------------------- options bar */

.options-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
}
.bar-label {
  color: var(--ink-muted);
  font-size: var(--fs-xs);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  flex: 1;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px 3px 8px;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  max-width: 260px;
}
.chip:hover {
  border-color: var(--ink-faint);
}
.chip .id {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}
.chip .stage-pill {
  flex-shrink: 0;
}
.chip-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-title.empty,
.pick-title.empty {
  color: var(--ink-faint);
  font-style: italic;
}
.chip.active {
  border-color: var(--opt);
  box-shadow: inset 0 0 0 1px var(--opt);
  background: color-mix(in srgb, var(--opt) var(--option-tint-strength), var(--surface));
}
.chip.active .id {
  color: var(--ink);
}
.chip.picking {
  box-shadow: inset 0 0 0 1px var(--opt), 0 0 0 3px color-mix(in srgb, var(--opt) 30%, transparent);
}
.chip.add {
  border-style: dashed;
  color: var(--ink-muted);
  padding-left: 11px;
}
.chip.drop-before {
  box-shadow: -3px 0 0 var(--accent);
}
.chip.drop-after {
  box-shadow: 3px 0 0 var(--accent);
}
.swatch {
  flex: none;
}
.swatch line {
  stroke: var(--opt);
  stroke-width: 2;
  stroke-linecap: round;
}
.swatch circle {
  fill: var(--opt);
}
.bar-toggles {
  display: flex;
  gap: var(--space-1);
}
.toggle {
  border-color: var(--rule);
}
.toggle[aria-pressed='true'] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.pick-hint {
  flex-basis: 100%;
  padding: 6px 10px;
  border-left: 3px solid var(--opt);
  background: color-mix(in srgb, var(--opt) 8%, var(--bg));
  color: var(--ink);
  font-size: var(--fs-sm);
}

/* ---------------------------------------------------------------- inspector */

.inspector {
  border-left: 1px solid var(--rule);
  background: var(--bg-chrome);
  overflow: auto;
  min-width: 0;
}
.inspector-closed .inspector {
  border-left: 0;
  overflow: hidden;
}
.insp-body {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.insp-head {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  border-bottom: 1px solid var(--rule-strong);
  padding-bottom: var(--space-2);
}
.insp-kind {
  font-family: var(--font-display);
  font-weight: var(--title-weight);
  font-size: var(--fs-lg);
}
.insp-ref {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
  text-align: right;
}
.option-ref {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin: 0;
}
.field-label {
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}
.field-input {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 6px 8px;
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
}
textarea.field-input {
  resize: vertical;
  min-height: 64px;
  font-size: var(--fs-note);
}
.field-input:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: var(--focus-ring);
}
.title-input {
  font-weight: 600;
}
.field-input.num {
  width: 72px;
  font-family: var(--font-mono);
}
.scale-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
}
.insp-meta {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}
.insp-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.insp-actions .btn kbd {
  margin-left: var(--space-2);
}
.btn {
  border-color: var(--rule);
  background: var(--surface);
}
.btn.primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn.primary:hover {
  background: var(--ink);
  opacity: 0.88;
}
.btn.danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}
.btn.danger:hover {
  background: var(--danger);
  opacity: 0.9;
}
.btn.danger-quiet {
  color: var(--danger);
}
.btn.danger-quiet:hover {
  background: var(--danger-bg);
}
.btn.pressed {
  background: var(--ink);
  color: var(--bg);
}
.link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 2px;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  align-self: flex-start;
}
.segmented {
  display: flex;
  gap: var(--space-1);
}
.stage-choice {
  flex-wrap: wrap;
}
.toggle.stage-1:not([aria-pressed='true']),
.stage-pill.stage-1,
.legend-swatch.stage-1 {
  background: var(--stage-1-bg);
}
.toggle.stage-2:not([aria-pressed='true']),
.stage-pill.stage-2,
.legend-swatch.stage-2 {
  background: var(--stage-2-bg);
}
.toggle.stage-3:not([aria-pressed='true']),
.stage-pill.stage-3,
.legend-swatch.stage-3 {
  background: var(--stage-3-bg);
}
.stage-toggle {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.stage-toggle[aria-pressed='true'] kbd {
  background: transparent;
  color: inherit;
  border-color: currentColor;
}
.stage-pill {
  display: inline-block;
  padding: 0 7px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  line-height: 16px;
  color: var(--ink);
  white-space: nowrap;
}
.stage-names {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.stage-names .field-label {
  font-size: var(--fs-xs);
}

/* legend and scope filter above the grids */
.legend-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2) var(--space-5);
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 14px;
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}
.legend strong {
  color: var(--ink);
  font-weight: 600;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.legend-swatch {
  width: 16px;
  height: 11px;
  border: 1px solid var(--rule);
}
.legend-out {
  color: var(--mark-out-ink);
  text-decoration: line-through;
}
.eval-bar .scope-filter {
  margin-left: var(--space-4);
}
.scope-filter {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.scope-filter .toggle {
  font-size: var(--fs-xs);
}
.mark-toggle {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.mark-toggle[aria-pressed='true'] kbd {
  background: transparent;
  color: inherit;
  border-color: currentColor;
}
.pick-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pick-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 4px;
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.pick-row:hover {
  background: var(--bg-subtle);
}
.pick-row .id {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}
.pick-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile {
  margin: 0;
  display: grid;
  grid-template-columns: minmax(80px, 40%) 1fr;
  gap: 4px 10px;
  font-size: var(--fs-note);
}
.profile dt {
  color: var(--ink-muted);
}
.profile dd {
  margin: 0;
}
.profile dd.none {
  color: var(--ink-faint);
}
.shortcuts {
  margin: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
}
.shortcuts dt {
  font-family: var(--font-mono);
  color: var(--ink);
  white-space: nowrap;
}
.shortcuts dd {
  margin: 0;
  color: var(--ink-muted);
}
.passthrough {
  margin: 0;
  max-height: 160px;
  overflow: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  white-space: pre-wrap;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 6px 8px;
}

/* ---------------------------------------------------------------- dialogs, tooltip, toast */

.dialog {
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: var(--space-5);
  max-width: min(520px, calc(100vw - 32px));
  width: 100%;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 18px 60px rgb(0 0 0 / 0.2);
}
.dialog.wide {
  max-width: min(760px, calc(100vw - 32px));
}
.dialog::backdrop {
  background: rgb(0 0 0 / 0.28);
}
.dialog-title {
  margin: 0 0 var(--space-3);
  font-family: var(--font-display);
  font-weight: var(--title-weight);
  font-size: var(--fs-xl);
  letter-spacing: var(--title-tracking);
}
.dialog-content {
  max-height: 65vh;
  overflow: auto;
}
.dialog-content p {
  margin: 0 0 var(--space-3);
}
.dialog-content h3 {
  font-family: var(--font-display);
  font-weight: var(--title-weight);
  font-size: var(--fs-lg);
  margin: var(--space-4) 0 var(--space-2);
}
.dialog-content h3:first-child {
  margin-top: 0;
}
.dialog-buttons {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-4);
}
.dialog .btn {

const FORMAT_DOC = "# The zwicky file format (`*.zwicky.md`), version 1\n\nA zwicky file holds one **space**: a problem space and a solution space (grids of *dimensions × parameters*), the **options** composed from the solution space, the **criteria** they are rated against, and the **ratings**. It is plain Markdown, readable in any viewer and diffable in Git, with a small, strict structure that tools (and LLMs) can parse.\n\nThis document is the contract. The reference implementation is `src/js/format.js`, and it is kept in sync with this text. You can hand this file to an LLM and ask it to draft or edit a space.\n\n## Principles\n\n- Every file is valid CommonMark.\n- Structure is carried **only** by: the front matter, heading levels, list items, blockquote notes (`>`), and one trailing `{…}` tag group. Nothing else has meaning.\n- **Tolerant reader, canonical writer.** zwicky accepts small variations when it opens a file and always saves one canonical form. Saving an unchanged canonical file produces the same bytes (apart from `updated`).\n- Opening never fails on content. Problems are listed in an **import report** with line numbers. Lines that cannot be placed are kept in a `# Notes` section instead of being dropped.\n- Parameters belong to their dimension by position. Options and criteria have **stable ids** (`O1`, `C1`) used for all cross-references.\n\n## Example\n\n```markdown\n---\nzwicky: 1\ntitle: Car Concept\nscale: 1-5\nstages: Pilot, Rollout, Full\nupdated: 2026-10-09\n---\n\n# Problem\n> The problem statement. Consecutive \"> \" lines form one multi-line note.\n\n## Market\n> A dimension note.\n- Urban commuters {focus}\n  > A parameter note, indented two spaces.\n- Families {focus=2}\n- Long-distance travellers {focus=3}\n- Luxury segment {out}\n\n# Solution\n\n## Drivetrain\n- Hybrid {O1}\n- Electric {O1 O2}\n  > A parameter note.\n- Diesel\n\n# Options\n\n## O1 Athletic hybrid SUV {stage=2}\n> An option note.\n\n## O2 City coupé {stage=1}\n\n# Criteria\n\n## C1 Market size {w=3}\n> What \"great\" looks like.\n\n## C2 Brand fit\n\n# Ratings\n\n## O1 Athletic hybrid SUV\n- C1: 4\n  > The rationale or assumption behind this score.\n- C2: ?\n  > A note without a score yet.\n\n## O2 City coupé\n- C1: 3\n```\n\n## Grammar\n\n### Front matter\n\nThe file starts with a front matter block between two `---` lines. It is a strict subset of YAML: one `key: value` per line, no nesting, no quoting. The value is everything after the first `: `, trimmed.\n\n| Key | Meaning |\n|---|---|\n| `zwicky` | Format version. Required; currently `1`. |\n| `title` | Document title. |\n| `scale` | Rating scale `<min>-<max>`, non-negative integers, `min < max ≤ 100`. Default `1-5`. |\n| `stages` | Names of the three stages, comma-separated: `stages: Pilot, Rollout, Full`. Default `Horizon 1, Horizon 2, Horizon 3`, which is not written. Names cannot contain commas. |\n| `updated` | ISO date (`YYYY-MM-DD`), set by zwicky on Save. |\n\nOther keys are kept, in their original order.\n\n### Sections\n\nTop-level `#` headings, in this order, each optional:\n\n| Section | Holds |\n|---|---|\n| `# Problem` | Dimensions of the problem space. Its note is the **problem statement**. |\n| `# Solution` | Dimensions of the solution space. |\n| `# Options` | One `## O<n> Title` heading per option. |\n| `# Criteria` | One `## C<n> Title {w=<weight>}` heading per criterion. |\n| `# Ratings` | One `## O<n> Title` block per option, with one line per rated criterion. |\n| `# Notes` | Free text, kept verbatim. Always last. |\n\nEvery section except `# Notes` can carry a note directly under its heading.\n\n### Dimensions and parameters (Problem, Solution)\n\n- A **dimension** is a `##` heading. Its title is a short buzzword.\n- A **parameter** is a list item `- Title` under its dimension. Rows can have different numbers of parameters.\n- Problem parameters can carry a **stage** or the **out-of-scope mark**, never both:\n  - `{focus}` is stage 1, where the scope  three names: the missing ones get the defaults †; with more than three: the extra names are dropped †.\n- `###` sub-dimensions: flattened †.\n- A section repeated: merged †.\n- Unknown `#` sections and lines that fit nowhere (paragraph text, list items outside a dimension, notes with nothing to belong to): moved to `# Notes` †.\n- `- C1:` with nothing after the colon: same as `?`.\n\n## Versions\n\n`zwicky: 1` in the front matter is the format version. Stages were added to version 1 without a version change: an older zwicky keeps `{focus=2}`, `{stage=1}` and `stages:` as unknown tags and keys, so nothing is lost. A file with a higher version than the app supports is refused with a clear message instead of being misread. Older versions are upgraded step by step on open (the `MIGRATIONS` list in `format.js`).\n\n## Scoring (for reference)\n\nThe weighted score of an option is Σ weight × score ÷ Σ weight, over the criteria that are rated for that option and have weight > 0, shown with one decimal. Unrated criteria do not count as zero; they are counted separately. Options are ranked by the displayed score; equal scores share a rank (1, 1, 3).\n";

    { label: 'Coordinates', checked: app.state.coords, action: () => app.setView({ coords: !app.state.coords }) },
    { label: 'Inspector', shortcut: 'I', checked: app.state.inspectorOpen, action: () => app.toggleInspector() },
  ]);

  els.top.append(
    h('div', { class: 'wordmark', 'aria-label': 'zwicky.' }, 'zwicky', h('span', { class: 'dot' }, '.')),
    els.title,
    els.tabs,
    h('div', { class: 'spacer' }),
    els.status,
    fileMenu,
    h('div', { class: 'btn-group' }, els.undo, els.redo),
    viewMenu,
    h('button', { class: 'icon-btn', title: 'Help (?)', 'aria-label': 'Help', onclick: () => app.help() }, '?'),
    (els.inspectorToggle = h('button', { class: 'icon-btn inspector-toggle', title: 'Inspector (I)', 'aria-label': 'Toggle inspector', onclick: () => app.toggleInspector() }, '▤')),
  );
}

function renderTop() {
  const { state, space } = app;
  if (document.activeElement !== els.title) els.title.value = space.meta.title;
  for (const b of els.tabs.querySelectorAll('.tab')) {
    const on = b.dataset.tab === state.tab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
  }
  els.undo.disabled = !app.history.canUndo;
  els.redo.disabled = !app.history.canRedo;
  els.inspectorToggle.setAttribute('aria-pressed', state.inspectorOpen ? 'true' : 'false');
  renderStatus();
  document.title = (space.meta.title || 'Untitled') + ' · zwicky.';
}

function renderStatus() {
  if (!els.status) return;
  const { dirty, fileName } = app.state;
  els.status.textContent = dirty ? 'Unsaved changes' : fileName ? 'Saved' : '';
  els.status.classList.toggle('dirty', dirty);
}

let unwatchPaths = null;

function renderMain() {
  const { state } = app;
  const tab = state.tab;
  const active = document.activeElement;
  const focusInHead = els.head.contains(active) && isTextInput(active);
  const gridHadFocus = active === document.body || active === null || els.body.contains(active);

  // remember scroll per tab
  const oldScroll = els.body.querySelector('.grid-scroll');
  if (oldScroll) state.scroll[oldScroll.dataset.tab] = [oldScroll.scrollLeft, oldScroll.scrollTop];

  if (!focusInHead) {
    clear(els.head);
    els.head.dataset.tab = tab;
    if (tab === 'problem') {
      els.head.append(noteBand(app.space.problem, 'Problem statement', 'What problem are we solving? Write the problem statement here.', 'band'));
      els.head.append(renderLegend(app, 'problem'));
    }
    if (tab === 'solution') {
      els.head.append(noteBand(app.space.solution, 'Solution intro', 'Optional intro note for the solution space.', 'intro'));
      els.head.append(renderOptionsBar(app));
      els.head.append(renderLegend(app, 'solution'));
    }
    if (tab === 'evaluation') els.head.append(renderEvalHead(app));
  }

  if (unwatchPaths) unwatchPaths();
  unwatchPaths = null;
  clear(els.body);
  els.body.dataset.tab = tab;

  if (tab === 'problem' || tab === 'solution') {
    if (state.editing && state.editing.section !== tab) state.editing = null;
    const { el, focusEl } = renderGrid(app, tab);
    const scroller = h('div', { class: 'grid-scroll', dataset: { tab } }, el);
    els.body.append(scroller);
    const [sl, st] = state.scroll[tab] || [0, 0];
    scroller.scrollLeft = sl;
    scroller.scrollTop = st;
    if (tab === 'solution') {
      drawPaths(app, el);
      unwatchPaths = watchPaths(app, el);
    }
    if (focusEl && (gridHadFocus || focusEl.tagName === 'TEXTAREA')) {
      focusEl.focus({ preventScroll: true });
      if (focusEl.tagName === 'TEXTAREA') {
        const n = focusEl.value.length;
        focusEl.setSelectionRange(n, n);
        focusEl.style.height = focusEl.scrollHeight + 'px';
      }
      ensureVisible(scroller, focusEl.closest('.cell'));
    }
  } else {
    if (state.editing && state.editing.section !== tab) state.editing = null;
    const { el, focusEl } = renderEvaluation(app);
    const scroller = h('div', { class: 'grid-scroll eval-scroll', dataset: { tab } }, el);
    els.body.append(scroller);
    const [sl, st] = state.scroll[tab] || [0, 0];
    scroller.scrollLeft = sl;
    scroller.scrollTop = st;
    if (focusEl && (gridHadFocus || focusEl.tagName === 'TEXTAREA')) {
      focusEl.focus({ preventScroll: true });
      if (focusEl.tagName === 'TEXTAREA') {
        const n = focusEl.value.length;
        focusEl.setSelectionRange(n, n);
        focusEl.style.height = focusEl.scrollHeight + 'px';
      }
      ensureVisible(scroller, focusEl.closest('.ecell'));
    }
  }
}

function noteBand(target, label, placeholder, kind) {
  return h(
    'div',
    { class: ['note-band', kind] },
    kind === 'band' ? h('span', { class: 'band-arrow', 'aria-hidden': 'true' }, '↣') : null,
    field(app, { label, value: target.note, multiline: true, placeholder, onInput: (v) => (target.note = v), cls: 'band-input', wrapClass: 'band-field', rows: 1 }),
  );
}

function ensureVisible(scroller, cell) {
  if (!cell) return;
  const sr = scroller.getBoundingClientRect();
  const cr = cell.getBoundingClientRect();
  const isSticky = (c) => c.classList.contains('sticky') || c.classList.contains('dim');
  const sticky = isSticky(cell) ? 0 : [...cell.parentElement.children].filter(isSticky).reduce((sum, c) => sum + c.offsetWidth, 0);
  if (cr.left < sr.left + sticky) scroller.scrollLeft -= sr.left + sticky - cr.left + 8;
  else if (cr.right > sr.right) scroller.scrollLeft += cr.right - sr.right + 8;
  if (cr.top < sr.top) scroller.scrollTop -= sr.top - cr.top + 8;
  else if (cr.bottom > sr.bottom) scroller.scrollTop += cr.bottom - sr.bottom + 8;
}

let lastInspectorKey = '';
function renderInspectorPanel() {
  const key = app.state.tab + '|' + inspectedKey(app);
  if (els.inspector.contains(document.activeElement) && isTextInput(document.activeElement) && key === lastInspectorKey) return;
  lastInspectorKey = key;
  clear(els.inspector);
  if (!app.state.inspectorOpen) return;
  els.inspector.append(renderInspector(app));
}

app.setTab = (tab) => {
  if (app.state.editing) app.finishEdit(document.querySelector('.inline-edit')?.value ?? null);
  app.state.tab = tab;
  app.tooltip.hide();
  savePrefs();
  app.render();
};

app.toggleInspector = () => {
  app.state.inspectorOpen = !app.state.inspectorOpen;
  savePrefs();

};

// ---------------------------------------------------------------- tooltip and toast

app.tooltip = (() => {
  let timer = 0;
  return {
    show(anchor, text) {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const tip = els.tooltip;
        tip.textContent = text;
        tip.hidden = false;
        const r = anchor.getBoundingClientRect();
        const w = tip.offsetWidth;
        const left = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2));
        let top = r.bottom + 6;
        if (top + tip.offsetHeight > window.innerHeight - 8) top = r.top - tip.offsetHeight - 6;
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }, 250);
    },
    hide() {
      clearTimeout(timer);
      if (els.tooltip) els.tooltip.hidden = true;
    },
  };
})();

let toastTimer = 0;
app.toast = (text) => {
  els.toast.textContent = text;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3200);
};

// ---------------------------------------------------------------- menus

let openMenu = null;
function closeMenu() {
  if (!openMenu) return;
  openMenu.panel.remove();
  openMenu.button.setAttribute('aria-expanded', 'false');
  openMenu = null;
}

function menu(label, items) {
  const button = h('button', { class: 'menu-btn', 'aria-haspopup': 'menu', 'aria-expanded': 'false' }, label, h('span', { class: 'caret', 'aria-hidden': 'true' }, '▾'));
  const open = (focusFirst) => {
    closeMenu();
    const panel = h('div', { class: 'menu', role: 'menu' });
    for (const it of items()) {
      if (it === 'sep') panel.append(h('div', { class: 'menu-sep', role: 'separator' }));
      else if (it.heading) panel.append(h('div', { class: 'menu-heading' }, it.heading));
      else {
        const role = it.checked === undefined ? 'menuitem' : it.radio ? 'menuitemradio' : 'menuitemcheckbox';
        panel.append(
          h(
            'button',
            {
              class: 'menu-item',
              role,
              tabindex: '-1',
              'aria-checked': it.checked === undefined ? null : it.checked ? 'true' : 'false',
              onclick: () => {
                closeMenu();
                button.focus();
                it.action();
              },
            },
            h('span', { class: 'check', 'aria-hidden': 'true' }, it.checked ? (it.radio ? '•' : '✓') : ''),
            h('span', { class: 'menu-label' }, it.label),
            it.shortcut ? h('span', { class: 'menu-shortcut' }, it.shortcut) : null,
          ),
        );
      }
    }
    panel.addEventListener('keydown', (e) => {
      const list = [...panel.querySelectorAll('.menu-item')];
      const i = list.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        list[(i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length].focus();
      } else if (e.key === 'Escape' || e.key === 'Tab') {
        e.preventDefault();
        closeMenu();
        button.focus();
      } else if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        list[e.key === 'Home' ? 0 : list.length - 1].focus();
      }
      e.stopPropagation();
    });
    document.body.append(panel);
    const r = button.getBoundingClientRect();
    panel.style.top = r.bottom + 4 + 'px';
    panel.style.left = Math.min(window.innerWidth - panel.offsetWidth - 8, r.left) + 'px';
    button.setAttribute('aria-expanded', 'true');
    openMenu = { panel, button };
    if (focusFirst) panel.querySelector('.menu-item').focus();
  };
  button.addEventListener('click', (e) => {
    e.stopPropagation();
    if (openMenu && openMenu.button === button) closeMenu();
    else open(e.detail === 0);
  });
  button.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      open(true);
    }
  });
  return button;
}

document.addEventListener('mousedown', (e) => {
  if (openMenu && !openMenu.panel.contains(e.target) && e.target !== openMenu.button && !openMenu.button.contains(e.target)) closeMenu();
});

// ---------------------------------------------------------------- dialogs

function dialog(title, content, buttons, { wide = false, onClose } = {}) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { class: ['dialog', wide && 'wide'], 'aria-label': title });
    const footer = h('div', { class: 'dialog-buttons' });
    let result = null;
    for (const b of buttons) {
      footer.append(
        h(
          'button',
          {
            class: ['btn', b.primary && 'primary', b.danger && 'danger'],
            autofocus: b.autofocus ? true : null,
            onclick: () => {
              result = b.value;
              dlg.close();
            },
          },
          b.label,
        ),
      );
    }
    dlg.append(h('h2', { class: 'dialog-title' }, title), h('div', { class: 'dialog-content' }, content), footer);
    dlg.addEventListener('close', () => {
      dlg.remove();
      if (onClose) onClose(result);
      resolve(result);
    });
    dlg.addEventListener('keydown', (e) => e.stopPropagation());
    document.body.append(dlg);
    app.tooltip.hide();
    closeMenu();
    dlg.showModal();
    const auto = dlg.querySelector('[autofocus]');
    if (auto) auto.focus();
  });
}

app.confirm = async (title, text, okLabel = 'OK') => {
  const r = await dialog(title, h('p', null, text), [
    { label: 'Cancel', value: false },
    { label: okLabel, value: true, danger: /delete|discard/i.test(okLabel), primary: !/delete|discard/i.test(okLabel), autofocus: true },
  ]);
  return r === true;
};

app.alert = (title, text) => dialog(title, h('p', null, text), [{ label: 'OK', value: true, primary: true, autofocus: true }]);

async function confirmDiscard() {
  if (!app.state.dirty) return true;
  return app.confirm('Discard unsaved changes?', 'The current space has changes that are not saved to a file. They are only in this browser’s cache, which is not a backup.', 'Discard');
}

function showReport(report, name) {

// ---------------------------------------------------------------- documents

function loadSpace(space, { fileName = '', handle = null, dirty = false } = {}) {
  app.space = space;
  app.history.clear();
  const { state } = app;
  state.cursor = { problem: null, solution: null, evaluation: null };
  state.inspect = { problem: null, solution: null, evaluation: null };
  state.editing = null;
  state.scroll = {};
  state.activeOption = space.options.items.length ? space.options.items[0].id : null;
  state.pickMode = false;
  state.handle = handle;
  state.fileName = fileName;
  state.dirty = dirty;
  autosave();
  autosave.flush();
  app.render();
}

/** Opens Markdown text. Returns true on success. */
function openText(text, { name = '', handle = null, dirty = false } = {}) {
  const { space, report } = parse(text);
  if (!space) {
    app.alert('Cannot open this file', report.map((r) => r.message).join('\n'));
    return false;
  }
  loadSpace(space, { fileName: name, handle, dirty });
  showReport(report, name);
  return true;
}

app.save = async (saveAs) => {
  const { state, space } = app;
  if (state.editing) app.finishEdit(document.querySelector('.inline-edit')?.value ?? null);
  const before = space.meta.updated;
  space.meta.updated = store.today();
  const text = serialize(space);
  const name = state.fileName || defaultFileName(space.meta.title);
  try {
    const res = await store.saveFile(text, { handle: state.handle, name, saveAs });
    if (!res) {
      space.meta.updated = before;
      return;
    }
    state.handle = res.handle;
    state.fileName = res.name;
    state.dirty = false;
    autosave();
    autosave.flush();
    app.toast(res.method === 'file' ? `Saved to ${res.name}.` : `Downloaded ${res.name}.`);
    app.render();
  } catch (err) {
    space.meta.updated = before;
    app.alert('Could not save', String(err && err.message));
  }
};

// ---------------------------------------------------------------- keyboard

document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  const target = e.target;
  const inText = isTextInput(target);

  if (mod && key === 's') {
    e.preventDefault();
    if (inText) target.blur();
    app.save(e.shiftKey);
    return;
  }
  if (mod && key === 'o') {
    e.preventDefault();
    app.open();
    return;
  }
  if (inText) return; // native editing (incl. its own undo) inside text fields
  if (openMenu) return;

  if (mod && (key === 'z' || key === 'y')) {
    e.preventDefault();
    if (key === 'y' || e.shiftKey) app.redo();
    else app.undo();
    return;
  }

  const { state } = app;
  const inGrid = target === document.body || !target || els.body.contains(target);
  if ((state.tab === 'problem' || state.tab === 'solution') && inGrid && gridKeydown(app, state.tab, e)) {
    e.preventDefault();
    return;
  }
  if (state.tab === 'evaluation' && inGrid && evaluationKeydown(app, e)) {
    e.preventDefault();
    return;
  }
  if (mod || e.altKey) return;

  if (e.key === '?') {
    e.preventDefault();
    app.help();
  } else if (key === 'i') {
    e.preventDefault();
    app.toggleInspector();
  } else if (e.key === 'Escape') {
    if (state.pickMode) app.activateOption(state.activeOption, false);
    else if (state.inspect[state.tab]) app.inspectOption(null);
    else if (state.tab === 'solution' && state.activeOption !== null && !state.compare) app.activateOption(null);
    else if (state.cursor[state.tab]) app.setCursor(state.tab, null);
  }
});

// ---------------------------------------------------------------- files dropped on the window

document.addEventListener('dragover', (e) => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    e.preventDefault();
    els.app.classList.add('file-over');
  }
});
document.addEventListener('dragleave', (e) => {
  if (!e.relatedTarget) els.app.classList.remove('file-over');
});
document.addEventListener('drop', async (e) => {
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  e.preventDefault();
  els.app.classList.remove('file-over');
  const file = files[0];
  if (!/\.(md|markdown|txt)$/i.test(file.name)) {
    app.alert('Not a Markdown file', `“${file.name}” is not a .md file.`);
    return;
  }
  if (!(await confirmDiscard())) return;
  const f = await store.readDroppedFile(file);
  openText(f.text, { name: f.name });
});

app.preparePrint = () => preparePrint(app);
window.addEventListener('beforeprint', () => {
  if (app.state.editing) app.finishEdit(document.querySelector('.inline-edit')?.value ?? null);
  preparePrint(app);
});
window.addEventListener('afterprint', cleanupPrint);

window.addEventListener('beforeunload', (e) => {
  autosave.flush();
  if (app.state.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') autosave.flush();
});

// ---------------------------------------------------------------- start

function start() {
  buildShell();
  applyRootAttributes();
  const saved = store.loadAutosave();
  if (saved) {
    const { space, report } = parse(saved.markdown);
    if (space) {
      loadSpace(space, { fileName: saved.fileName, dirty: saved.dirty });
      return;
    }
    const key = store.backupAutosave();
    app.alert('The browser cache could not be read', `${report.map((r) => r.message).join(' ')} It was kept under “${key}” and not overwritten.`);
  }
  openText(EXAMPLES['car-concept.zwicky.md'], { name: '' });
}

start();
